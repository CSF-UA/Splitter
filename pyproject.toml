[project]
name = "Splitter"
version = "5.0.0"
description = "Splits light curves of periodic variable stars into single-extremum intervals for O-C analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.0",
    "pyside6>=6.10.1",
    "scipy>=1.16.3",
    "vispy>=0.16.0",
]
